name: Deploy Discord Bot

on:
  push:
    branches:
      - master

# Два быстрых пуша в master не должны деплоиться параллельно
# (рестарт посреди чужого pip install); очередь без отмены.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # зависший тест не должен блокировать деплой на прод часами

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        # пины тулов: breaking-релиз pytest не должен блокировать срочный хотфикс
        run: pip install -r requirements.txt "pytest~=9.1" "pytest-asyncio~=1.4" "pytest-timeout~=2.4"

      - name: Run tests
        # 🛑 --timeout: зависший тест обязан НАЗВАТЬ СЕБЯ и уронить прогон, а не
        # молча съесть timeout-minutes job'а. Прецедент 08.08.2026: один тест
        # повис на Server.wait_closed() (регресс asyncio в 3.12, на 3.14 его
        # нет), job убился по лимиту, deploy пропустился — прод остался на
        # старом коде, а в логе не было ни одного имени теста.
        run: pytest -q --timeout=120 --timeout-method=thread

  deploy:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15   # зависший SSH иначе держит ран до 6 часов

    steps:
      - name: Deploy via SSH
        # Пин по commit SHA тега v1.0.3: мутабельный тег с доступом
        # к прод-SSH-ключу — вектор supply-chain
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.VDS_IP }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          port: ${{ secrets.VDS_PORT }}
          script: |
            # set -e: упавший шаг валит деплой (прецедент 12.07.2026: ddgs)
            set -e
            cd /opt/robocat
            # Wiki-workflow обновляет tracked JSON прямо на проде.
            # Сохраняем runtime-версию, иначе любой deploy откатит её к индексу
            # из git до следующего запуска обновления.
            runtime_index=/tmp/robocat-wiki-index-runtime.json
            restore_index=data/wiki_index.restore.json
            cp data/wiki_index.json "$runtime_index"
            rm -f "$restore_index"
            trap 'rm -f "$runtime_index" "$restore_index"' EXIT
            # Деплоим ровно тот SHA, что прошёл тесты, а не движущийся master:
            # пуш B во время деплоя A иначе обходит тест-гейт полностью
            git fetch origin master
            # Зависимости протестированного коммита ставим ДО переключения дерева:
            # упавший pip не оставляет новый код без новых зависимостей
            git show ${{ github.sha }}:requirements.txt > /tmp/robocat-req.txt
            .venv/bin/pip install -r /tmp/robocat-req.txt -q
            git reset --hard ${{ github.sha }}
            # Старый runtime-индекс можно вернуть только если его векторы
            # совместимы с моделью нового кода. При смене embedding-модели
            # остаётся индекс из коммита, а ближайший schedule пересоберёт свежий.
            if .venv/bin/python -c 'import json, sys; from bot.ai.embeddings import MODEL, DIMENSIONS; rows=json.load(open(sys.argv[1], encoding="utf-8")); assert rows and all(r.get("model") == MODEL and len(r.get("vector") or ()) == DIMENSIONS for r in rows)' "$runtime_index"; then
              cp "$runtime_index" "$restore_index"
              mv "$restore_index" data/wiki_index.json
            fi
            # Идемпотентная миграция схемы: новая таблица не ждёт ручного db_init
            .venv/bin/python data/db_init.py
            sudo -n systemctl restart robocat
            # systemctl restart зелёный сразу после fork'а — ждём и проверяем,
            # что бот не умер на старте (упавший старт красит деплой)
            sleep 5
            systemctl is-active --quiet robocat || { echo "robocat не поднялся после рестарта"; exit 1; }
